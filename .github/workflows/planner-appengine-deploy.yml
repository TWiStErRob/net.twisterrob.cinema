name: "Deploy to Google App Engine"

on:
  pull_request:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:

      production:
        description: 'Deploy to production?'
        required: true
        type: boolean
        default: false

# Keep a PR deployment and its cleanup from running at the same time.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('planner-preview-pr-{0}', github.event.number) || format('planner-appengine-deploy-{0}', github.run_id) }}

jobs:

  validate:
    name: "🦺 Validation"
    uses: TWiStErRob/github-workflows/.github/workflows/validate.yml@104620e2c495f0c905fde6f15ea2b6453ae4eaed # v3
    permissions:
      contents: read
      security-events: write
      actions: read


  filter:
    name: "Detect changes"
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 2
    permissions:
      # actions/checkout
      contents: read
      # tj-actions/changed-files
      pull-requests: read
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - name: "Checkout ${{ github.ref }} branch in ${{ github.repository }} repository."
        uses: actions/checkout@v7

      - name: "Find changes to unrelated paths."
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            planner/**
            .github/workflows/planner-appengine-deploy.yml
            .github/workflows/planner-appengine-delete.yml

    outputs:
      preview-version: ${{ steps.changed-files.outputs.any_modified == 'true' && format('pr-{0}-merge', github.event.number) || '' }}


  release:
    name: "Release to Google App Engine"
    needs:
      - validate
      - filter
    if: >-
      ${{
        (success() || failure() || cancelled() || needs.filter.result == 'skipped')
        && needs.validate.result == 'success'
        && (
          github.event_name != 'pull_request'
          || (
            needs.filter.result == 'success'
            && needs.filter.outputs.preview-version != ''
          )
        )
      }}
    timeout-minutes: 10
    environment:
      name: >-
        ${{ needs.filter.outputs.preview-version
          || ((github.event_name == 'push' || inputs.production == true) && 'production')
          || 'manual-preview' }}
      deployment: ${{ github.event_name != 'workflow_dispatch' || inputs.production }}
      url: >-
        ${{ env.RELEASE_TO_PRODUCTION == 'true' && 'https://cinema.twisterrob.net/'
          || format('https://{0}-dot-twisterrob-cinema.appspot.com/', steps.name.outputs.result) }}

    env:
      RELEASE_TO_PRODUCTION: ${{ github.event_name == 'push' || inputs.production == true }}

    permissions:
      contents: read  # This is required for actions/checkout.
      # https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/about-security-hardening-with-openid-connect#updating-your-actions-for-oidc
      id-token: write # This is required for requesting the JWT via google-github-actions/auth.

    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash

    steps:

      - name: "Determine Google App Engine version name."
        id: name
        uses: actions/github-script@v9
        env:
          INPUT_PROD: ${{ env.RELEASE_TO_PRODUCTION }}
          PREVIEW_VERSION: ${{ needs.filter.outputs.preview-version }}
        with:
          result-encoding: string
          script: |
            return process.env.INPUT_PROD === 'true'
              // Use blank to indicate that this is a release to production and should use automatic naming.
              ? 'release'
              : process.env.PREVIEW_VERSION || context.ref
                // refs/heads/main from workflow_dispatch and push events.
                .replace('refs/heads/', 'br-')
                // ERROR: (gcloud.app.deploy) argument --version/-v: Bad value [...]:
                // May only contain lowercase letters, digits, and hyphens.
                // Must begin and end with a letter or digit. Must not exceed 63 characters.
                .replace(/[^a-z0-9-]/g, '-')

      - name: "Checkout ${{ github.ref }} branch in ${{ github.repository }} repository."
        uses: actions/checkout@v7

      - name: "Set up Java."
        uses: actions/setup-java@v6
        with:
          java-version-file: planner/.java-version
          distribution: temurin

      - name: "Set up Node."
        uses: actions/setup-node@v7
        with:
          node-version-file: planner/package.json

      - name: "Set up NPM."
        # https://github.com/actions/setup-node/issues/324
        run: npm install --global npm@12

      - name: "Authenticate to Google Cloud."
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GAE_WIP }}
          service_account: ${{ secrets.GAE_SA }}

      - name: "Print tooling versions."
        run: |
          node -v
          npm -v
          java -version
          gcloud --version

      - name: "Build Frontend."
        working-directory: planner
        run: |
          npm install
          cd frontend
          npm run build:prod

      - name: "Build Backend."
        working-directory: planner
        run: >
          ./gradlew
          :backend:endpoint:jar

      - name: "Publish ${{ env.VERSION }} to Google App Engine (production=${{ env.RELEASE_TO_PRODUCTION }})."
        working-directory: planner
        env:
          # Use pre-existing SDK, don't download a new one.
          GCLOUD_HOME: /usr/lib/google-cloud-sdk
          # Will be propagated to app.yml
          NEO4J_URL: ${{ secrets.NEO4J_URL }}
          VERSION: ${{ steps.name.outputs.result }}
        run: >
          ./gradlew
          :deploy:appengine:appengineDeploy
          -Pnet.twisterrob.deploy.replaceLive="${RELEASE_TO_PRODUCTION}"
          -Pnet.twisterrob.deploy.versionName="${VERSION}"
