name: "Delete from Google App Engine"

on:
  pull_request_target:
    types:
      - closed
  delete: # branches
  workflow_dispatch:

# Wait for any App Engine deployment of this PR before deleting its preview.
concurrency:
  group: ${{ github.event_name == 'pull_request_target' && format('planner-preview-pr-{0}', github.event.number) || format('planner-appengine-delete-{0}', github.run_id) }}

jobs:

  release:
    name: "Delete from Google App Engine"
    timeout-minutes: 5

    # Only trigger when deleting branches, or any other event type.
    if: ${{ github.event_name != 'delete' || github.event.ref_type == 'branch' }}

    permissions:
      contents: read  # This is required for actions/checkout.
      actions: read # Read the PR's GitHub environment.
      deployments: write # Mark deployments inactive after their preview is deleted.
      # https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/about-security-hardening-with-openid-connect#updating-your-actions-for-oidc
      id-token: write # This is required for requesting the JWT via google-github-actions/auth.

    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash

    steps:

      - name: "Determine Google App Engine version name."
        id: name
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const branch = {
              // Reconstruct the PR merge ref from the number because pull_request_target uses the base ref.
              pull_request_target: `refs/pull/${context.payload.number}/merge`,
              // on:delete's context.ref is always `refs/heads/main`
              // So use github.event.ref which is just the name, so polyfill with prefix to be consistent for next steps.
              // See https://stackoverflow.com/a/62293570/253468
              delete: `refs/heads/${context.payload.ref}`,
              // on:workflow_dispatch's ref is the full ref selected in the UI, so use it as-is.
              workflow_dispatch: context.ref,
            }[context.eventName]
            return branch
              // refs/heads/main from workflow_dispatch and delete events.
              .replace('refs/heads/', 'br-')
              // refs/pull/123/merge from pull_request.closed event.
              .replace('refs/pull/', 'pr-')
              // ERROR: (gcloud.app.deploy) argument --version/-v: Bad value [...]:
              // May only contain lowercase letters, digits, and hyphens.
              // Must begin and end with a letter or digit. Must not exceed 63 characters.
              .replace(/[^a-z0-9-]/g, '-')

      # Google Cloud authentication needs a checkout. Use the base commit on pull_request_target.
      - name: "Checkout the workflow's trusted revision."
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "Authenticate to Google Cloud."
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GAE_WIP }}
          service_account: ${{ secrets.GAE_SA }}

      - name: "Print tooling versions."
        run: |
          gcloud --version

      - name: "Delete version ${{ env.VERSION }} from Google App Engine."
        env:
          VERSION: ${{ steps.name.outputs.result }}
        run: |
          deployed_version="$(gcloud app versions list --project="twisterrob-cinema" --service="default" \
            --filter="version.id=${VERSION}" --format="value(version.id)")"
          if [[ "${deployed_version}" != "${VERSION}" ]]; then
            echo "App Engine version ${VERSION} is already absent."
            exit 0
          fi
          gcloud app versions delete --quiet --project="twisterrob-cinema" --service="default" "${VERSION}"

      - name: "Remove the PR's GitHub environment."
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/github-script@v9
        env:
          GH_ENVIRONMENT_CLEANUP_TOKEN: ${{ secrets.GH_ENVIRONMENT_CLEANUP_TOKEN }}
        with:
          script: |
            const repo = context.repo
            const environment = 'pr-' + context.payload.number
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...repo,
              environment,
              per_page: 100,
            })
            for (const {id: deployment_id} of deployments) {
              const params = {...repo, deployment_id}
              const {data: [latest]} = await github.rest.repos.listDeploymentStatuses({...params, per_page: 1})
              if (latest?.state !== 'inactive') {
                await github.rest.repos.createDeploymentStatus({...params, state: 'inactive'})
              }
            }

            const params = {...repo, environment_name: environment}
            try {
              await github.rest.repos.getEnvironment(params)
            } catch (error) {
              if (error.status === 404) {
                core.info('GitHub environment ' + environment + ' is already absent.')
                return
              }
              throw error
            }

            const token = process.env.GH_ENVIRONMENT_CLEANUP_TOKEN
            if (!token) {
              throw new Error('Configure GH_ENVIRONMENT_CLEANUP_TOKEN with repository Administration write permission.')
            }
            await getOctokit(token).request('DELETE /repos/{owner}/{repo}/environments/{environment_name}', params)
